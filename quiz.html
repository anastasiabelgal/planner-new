<!doctype html>
<html lang="ru"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Допуск SDR HotelCompas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Концепт: табло вылета. Каждая тема теста - рейс, итог - посадочный талон. */
:root{
  --bg:#EEF2F8; --panel:#FFFFFF; --ink:#0B1F3A; --muted:#566884; --line:#D6DEEB;
  --accent:#0061FF; --on-accent:#FFFFFF; --gold:#B86E00; --gold-bg:#FFF1D6;
  --good:#17804F; --good-bg:#E1F5EA; --bad:#C23B31; --bad-bg:#FCE6E3; --soft:#F5F8FD;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1424; --panel:#12213A; --ink:#E8EEF8; --muted:#94A4BE; --line:#23365A;
    --accent:#5B96FF; --on-accent:#06142B; --gold:#F2B04A; --gold-bg:#3A2D12;
    --good:#4CC38A; --good-bg:#12372A; --bad:#FF8076; --bad-bg:#40201F; --soft:#0F1B31;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1424; --panel:#12213A; --ink:#E8EEF8; --muted:#94A4BE; --line:#23365A;
  --accent:#5B96FF; --on-accent:#06142B; --gold:#F2B04A; --gold-bg:#3A2D12;
  --good:#4CC38A; --good-bg:#12372A; --bad:#FF8076; --bad-bg:#40201F; --soft:#0F1B31;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:12px 20px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.xp{display:flex;gap:14px;align-items:center}
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);white-space:nowrap}
.chip b{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.hero{padding-block:8px 24px}
.hero h1{font-size:clamp(26px,6vw,38px);margin:10px 0 14px}
.hero p{max-width:60ch;color:var(--muted);margin:0 0 10px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:22px 0}
.rules div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px}
.rules b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
label.name{display:block;margin:18px 0 6px;font-weight:700}
input[type=text]{width:100%;max-width:360px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;margin-bottom:16px}
.board{display:flex;flex-direction:column;gap:8px}
.leg{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;width:100%}
.leg .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.leg h3{font-size:15px;font-family:var(--f-body);font-weight:700}
.leg small{color:var(--muted);display:block;margin-top:2px}
.leg.locked{opacity:.55;cursor:not-allowed}
.leg.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stars{font-family:var(--f-mono);color:var(--gold);letter-spacing:2px;white-space:nowrap;text-align:right}
.stars em{font-style:normal;color:var(--line)}
.stat{font-size:12px;color:var(--muted);display:block;text-align:right;letter-spacing:0}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 22px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qtext{font-size:18px;font-weight:700;margin:14px 0 6px;text-wrap:pretty}
.hint-tag{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);flex:0 0 auto;margin-top:1px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.mrow{display:grid;grid-template-columns:1fr minmax(160px,230px);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.mrow.ok select{border-color:var(--good);background:var(--good-bg)}
.mrow.no select{border-color:var(--bad);background:var(--bad-bg)}
.mrow .fix{grid-column:1/-1;font-size:12.5px;color:var(--good)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.fb .ref{display:block;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.ticket{display:grid;grid-template-columns:1fr 200px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ticket .main{padding:24px}
.ticket .stub{padding:24px;border-left:2px dashed var(--line);background:var(--soft);display:flex;flex-direction:column;gap:12px;justify-content:center}
.ticket .big{font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1}
.ticket h2{font-size:22px;margin:8px 0 10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px}
.kv div span{display:block}
.kv .v{font-weight:700;font-size:16px}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.topics .chip{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.pass{color:var(--good)} .fail{color:var(--bad)}
.legres{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}
.legres div{min-width:90px}
.legres .big{font-family:var(--f-display);font-size:28px;font-weight:700}
textarea.share{width:100%;min-height:150px;margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:13px/1.5 var(--f-mono)}
.sent{font-size:13px;margin-top:12px;color:var(--muted)} .sent.ok{color:var(--good)}
.rrow{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;margin-bottom:10px}
.rrow summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.rrow ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
@media (max-width:560px){
  .ticket{grid-template-columns:1fr}
  .ticket .stub{border-left:0;border-top:2px dashed var(--line)}
  .leg{grid-template-columns:1fr auto}
  .leg .code{grid-column:1/-1}
  .mrow{grid-template-columns:1fr}
  .card{padding:18px}
}
@media (prefers-reduced-motion: reduce){ .prog i{transition:none} }
</style>

</head><body>
<div class="wrap" id="app" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
var firebaseConfig = {
  apiKey: "AIzaSyCNllF-829_5wKylE1_EU9gZFlM-pvuSI0",
  authDomain: "hotelcompas-880d9.firebaseapp.com",
  projectId: "hotelcompas-880d9",
  storageBucket: "hotelcompas-880d9.firebasestorage.app",
  messagingSenderId: "47724626160",
  appId: "1:47724626160:web:7fd5d98a9d34fa79740235"
};
var fbApp = initializeApp(firebaseConfig);
var auth = getAuth(fbApp);
var fdb = getFirestore(fbApp);
var NASTYA_EMAIL = 'a.belousova@hotelcompas.com';
var BLOCKED_EMAILS = ['r.vizuete@hotelcompas.com']; // бывший сотрудник, вход закрыт
/* ---------- Вопросы ----------
   t: single | multi | match; a: индекс верного (single), массив индексов (multi), массив по строкам (match) */
var LEGS = []; // вопросы загружаются из Firebase после входа (privateContent/quizContent)

LEGS.forEach(function(l,i){ l.num = i+1; });
/* ---------- Состояние ---------- */
var KEY = 'hc_sdr_quiz_v1';
var state = { name:'', res:{} };
try { var raw = localStorage.getItem(KEY); if(raw){ var s = JSON.parse(raw); if(s && s.res) state = s; } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
var app = document.getElementById('app');
var run = null;

function totalXp(){ var x=0; Object.keys(state.res).forEach(function(k){ x += state.res[k].xp; }); return x; }
function done(){ return Object.keys(state.res).length; }
function totals(){
  var c=0,t=0; LEGS.forEach(function(l){ if(state.res[l.id]){ c+=state.res[l.id].correct; t+=state.res[l.id].total; } });
  return {c:c,t:t};
}
function stars(p){ return p>=0.9?3:p>=0.7?2:p>=0.5?1:0; }
function starStr(n){ return '★'.repeat(n) + '<em>' + '★'.repeat(3-n) + '</em>'; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toTop(){ window.scrollTo({top:0}); }

/* ---------- Отправка результата (если страница открыта по ссылке и есть доступ) ---------- */
var remote = { id:null, owner:false, status:'unknown', email:'' };
function allowedUser(u){
  if(!u || !u.email || !u.emailVerified) return false;
  var e = u.email.toLowerCase();
  if(BLOCKED_EMAILS.indexOf(e) > -1) return false;
  return /@hotelcompas\.com$/.test(e);
}

function payload(){
  var t = totals(), legs = {};
  LEGS.forEach(function(l){ var r = state.res[l.id]; if(r) legs[l.id] = { name:l.name, correct:r.correct, total:r.total, missed:r.missed.map(function(i){ return l.qs[i].q; }) }; });
  return { name: state.name||'', updatedAt: new Date().toISOString(), correct:t.c, total:t.t, pct: t.t?Math.round(t.c/t.t*100):0, xp: totalXp(), legsDone: done(), complete: done()===LEGS.length, legs: legs };
}
function sendResult(cb){
  if(remote.status!=='ready'){ cb && cb(false); return; }
  var data = payload(); data.email = remote.email;
  setDoc(doc(fdb,'quizResults',remote.id), data).then(function(){ cb && cb(true); }, function(){ cb && cb(false); });
}
function resultText(){
  var p = payload(), lines = ['Тест SDR HotelCompas', 'Имя: '+(p.name||'-'), 'Дата: '+new Date().toLocaleDateString('ru-RU'),
    'Итог: '+p.pct+'% ('+p.correct+' из '+p.total+'), опыт '+p.xp+' XP', 'Пройдено рейсов: '+p.legsDone+' из '+LEGS.length, ''];
  LEGS.forEach(function(l){ var r=p.legs[l.id]; if(r){ lines.push('Рейс '+l.num+' '+l.name+': '+r.correct+'/'+r.total); r.missed.forEach(function(q){ lines.push('  - ошибка: '+q); }); } });
  return lines.join('\n');
}
function shareBlock(){
  return '<div class="actions"><button class="btn" id="copy">Скопировать результат</button></div>'+
    '<div id="sentmsg" class="sent">'+(remote.status==='ready'?'Результат отправляется автоматически.':'Не получилось подключиться к планеру. Нажми «Скопировать» и вставь текст в Telegram Насте.')+'</div>'+
    '<textarea class="share" id="sharebox" readonly hidden></textarea>';
}
function wireShare(){
  var c = document.getElementById('copy'); if(!c) return;
  c.onclick = function(){
    var txt = resultText(), box = document.getElementById('sharebox');
    box.hidden = false; box.value = txt; box.focus(); box.select();
    try { navigator.clipboard.writeText(txt).then(function(){ c.textContent='Скопировано'; }, function(){ c.textContent='Выдели текст ниже и скопируй'; }); }
    catch(e){ c.textContent='Выдели текст ниже и скопируй'; }
  };
  sendResult(function(ok){ var m=document.getElementById('sentmsg'); if(m && remote.status==='ready'){ m.textContent = ok ? 'Результат отправлен Насте.' : 'Не получилось отправить автоматически. Нажми «Скопировать» и пришли текст Насте.'; m.className='sent'+(ok?' ok':''); } });
}

/* ---------- Экраны ---------- */
function header(){
  return '<div class="topbar"><span class="mono">HotelCompas · допуск SDR</span><div class="xp">'+
    '<span class="chip">Опыт <b>'+totalXp()+'</b> XP</span><span class="chip">Рейсов <b>'+done()+'</b>/'+LEGS.length+'</span></div></div>';
}

function screenStart(){
  var resume = done() > 0;
  app.innerHTML = header() +
   '<div class="hero"><span class="mono">Рейсов: '+LEGS.length+' · вопросов: '+LEGS.reduce(function(a,l){return a+l.qs.length;},0)+' · примерно 25 минут · вопросы: '+quizSource+'</span>'+
   '<h1>Допуск SDR: проверь, что ты готова к первому рейсу</h1>'+
   '<p>Это не экзамен на память. Тест показывает, где материал ещё не лёг, и подсказывает, какой раздел перечитать. Каждый рейс - одна тема из онбординга и регламента.</p></div>'+
   '<div class="rules">'+
    '<div><b>Опыт</b>10 XP за верный ответ с первой попытки, 5 XP, если брала подсказку. Серия из 5 верных подряд даёт +5.</div>'+
    '<div><b>Подсказка</b>Показывает, в каком разделе документа искать ответ. Можно брать, это не стыдно.</div>'+
    '<div><b>Допуск</b>Верно с первой попытки 80% и больше. Ошибки можно сразу отработать повторно.</div>'+
   '</div>'+
   '<div class="card"><label class="name" for="nm">Как тебя записать в талон?</label>'+
   '<input type="text" id="nm" placeholder="Имя" value="'+esc(state.name||'')+'" maxlength="40" autocomplete="off">'+
   '<div class="actions"><button class="btn" id="go">'+(resume?'Продолжить':'К карте рейсов')+'</button>'+
   (resume?'<button class="btn ghost" id="reset">Начать заново</button>':'')+(remote.owner?'<button class="btn ghost" id="ownerbtn">Результаты команды</button>':'')+'</div></div>';
  document.getElementById('go').onclick = function(){ state.name = document.getElementById('nm').value.trim(); save(); screenMap(); };
  var ob = document.getElementById('ownerbtn'); if(ob) ob.onclick = screenResults;
  var r = document.getElementById('reset');
  if(r) r.onclick = function(){ state = {name:document.getElementById('nm').value.trim(), res:{}}; save(); screenStart(); };
}

function screenMap(){
  var nextId = null;
  for(var i=0;i<LEGS.length;i++){ if(!state.res[LEGS[i].id]){ nextId = LEGS[i].id; break; } }
  var html = header() + '<h2 style="font-size:22px;margin-bottom:6px">Карта рейсов</h2><p style="color:var(--muted);margin:0 0 16px">Рейсы открываются по порядку. Пройденный рейс можно пересдать, лучший результат сохранится.</p><div class="board">';
  LEGS.forEach(function(l){
    var r = state.res[l.id], locked = !r && l.id !== nextId;
    var st = r ? '<span class="stars">'+starStr(stars(r.correct/r.total))+'</span><span class="stat">'+r.correct+' из '+r.total+'</span>' : '<span class="stat">'+(locked?'закрыт':'вылет')+'</span>';
    html += '<button class="leg'+(locked?' locked':'')+(l.id===nextId?' next':'')+'" data-id="'+l.id+'"'+(locked?' disabled':'')+'>'+
      '<span class="code">РЕЙС '+l.num+'/'+LEGS.length+'</span><span><h3>'+l.name+'</h3><small>'+l.sub+' · '+l.qs.length+' вопр.</small></span><span>'+st+'</span></button>';
  });
  html += '</div>';
  if(done() === LEGS.length) html += '<div class="actions"><button class="btn" id="fin">Получить талон</button></div>';
  app.innerHTML = html;
  Array.prototype.forEach.call(app.querySelectorAll('.leg:not(.locked)'), function(b){ b.onclick = function(){ startLeg(+b.dataset.id, false); }; });
  var f = document.getElementById('fin'); if(f) f.onclick = screenFinal;
  toTop();
}

function startLeg(id, practiceList){
  var leg = LEGS.filter(function(l){ return l.id===id; })[0];
  run = { leg:leg, list: practiceList || leg.qs.map(function(_,i){return i;}), i:0, correct:0, xp:0, streak:0, missed:[], practice: !!practiceList, usedHint:false };
  screenQ();
}

function screenQ(){
  var q = run.leg.qs[run.list[run.i]];
  run.usedHint = false; run.answered = false;
  var pct = Math.round(run.i/run.list.length*100);
  var html = header() + '<div class="card"><div class="qhead"><span class="mono">Рейс '+run.leg.id+' · '+run.leg.name+(run.practice?' · работа над ошибками':'')+'</span><span class="mono">Вопрос '+(run.i+1)+' из '+run.list.length+'</span></div>'+
    '<div class="prog" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+
    (q.t==='multi'?'<div class="hint-tag">Можно выбрать несколько ответов.</div>':'')+
    '<div id="body"></div><div id="hintbox"></div><div id="fbbox"></div>'+
    '<div class="actions" id="acts"></div></div>';
  app.innerHTML = html;
  renderBody(q);
  toTop();
}

function actions(q){
  var acts = document.getElementById('acts'); acts.innerHTML = '';
  if(!run.answered){
    var h = document.createElement('button'); h.className='btn ghost'; h.textContent='Подсказка (−5 XP)';
    h.onclick = function(){ run.usedHint = true; document.getElementById('hintbox').innerHTML = '<div class="hint-tag" style="margin-top:12px">Загляни сюда: <b>'+esc(q.ref)+'</b></div>'; h.disabled = true; };
    if(q.t!=='single'){
      var chk = document.createElement('button'); chk.className='btn'; chk.id='chk'; chk.textContent='Проверить'; chk.onclick = function(){ evalAnswer(q); };
      acts.appendChild(chk);
    }
    acts.appendChild(h);
  }
}

function renderBody(q){
  var body = document.getElementById('body'); body.innerHTML = '';
  if(q.t==='match'){
    q.items.forEach(function(it, idx){
      var row = document.createElement('div'); row.className='mrow'; row.dataset.idx = idx;
      var span = document.createElement('div'); span.textContent = it;
      var sel = document.createElement('select'); sel.setAttribute('aria-label', it);
      var d = document.createElement('option'); d.value=''; d.textContent='Выбери…'; sel.appendChild(d);
      q.o.forEach(function(o, oi){ var op = document.createElement('option'); op.value=oi; op.textContent=o; sel.appendChild(op); });
      row.appendChild(span); row.appendChild(sel); body.appendChild(row);
    });
  } else {
    var wrap = document.createElement('div'); wrap.className='opts';
    run.order = shuffle(q.o.map(function(_,i){return i;}));
    run.sel = {};
    run.order.forEach(function(oi, pos){
      var b = document.createElement('button'); b.className='opt'; b.type='button'; b.dataset.oi = oi;
      b.innerHTML = '<span class="k">'+String.fromCharCode(65+pos)+'</span><span>'+esc(q.o[oi])+'</span>';
      b.onclick = function(){
        if(run.answered) return;
        if(q.t==='single'){ run.sel = {}; run.sel[oi]=true; evalAnswer(q); }
        else { if(run.sel[oi]) delete run.sel[oi]; else run.sel[oi]=true; b.classList.toggle('sel'); }
      };
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  }
  actions(q);
}

function evalAnswer(q){
  var ok = false, blank = false;
  if(q.t==='single'){ ok = !!run.sel[q.a]; }
  else if(q.t==='multi'){
    var chosen = Object.keys(run.sel).map(Number).sort();
    if(!chosen.length){ blank = true; }
    ok = chosen.length === q.a.length && chosen.every(function(v,i){ return v === q.a.slice().sort()[i]; });
  } else {
    var rows = document.querySelectorAll('.mrow'); ok = true;
    Array.prototype.forEach.call(rows, function(r){
      var v = r.querySelector('select').value; if(v==='') blank = true;
      if(v === '' || +v !== q.a[+r.dataset.idx]) ok = false;
    });
  }
  if(blank){ document.getElementById('fbbox').innerHTML = '<div class="hint-tag" style="margin-top:12px">Выбери ответ, потом проверяй.</div>'; return; }
  run.answered = true;
  // подсветка
  if(q.t==='match'){
    Array.prototype.forEach.call(document.querySelectorAll('.mrow'), function(r){
      var sel = r.querySelector('select'), idx = +r.dataset.idx; sel.disabled = true;
      var good = +sel.value === q.a[idx]; r.classList.add(good?'ok':'no');
      if(!good){ var fx = document.createElement('div'); fx.className='fix'; fx.textContent='Верно: '+q.o[q.a[idx]]; r.appendChild(fx); }
    });
  } else {
    var corr = q.t==='single' ? [q.a] : q.a;
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
      var oi = +b.dataset.oi; b.disabled = true;
      if(corr.indexOf(oi) > -1) b.classList.add('ok');
      else if(run.sel[oi]) b.classList.add('no');
    });
  }
  var gained = 0;
  if(ok){
    run.correct++; run.streak++;
    gained = run.usedHint ? 5 : 10;
    if(run.streak > 0 && run.streak % 5 === 0) gained += 5;
  } else { run.streak = 0; run.missed.push(run.list[run.i]); }
  if(!run.practice) run.xp += gained;
  document.getElementById('fbbox').innerHTML =
    '<div class="fb '+(ok?'ok':'no')+'"><strong>'+(ok?'Верно':'Не совсем')+(ok&&gained?' · +'+gained+' XP':'')+'</strong>'+esc(q.why)+'<span class="ref">'+esc(q.ref)+'</span></div>';
  var acts = document.getElementById('acts'); acts.innerHTML='';
  var nx = document.createElement('button'); nx.className='btn';
  nx.textContent = run.i+1 < run.list.length ? 'Дальше' : 'Закончить рейс';
  nx.onclick = function(){ run.i++; if(run.i < run.list.length) screenQ(); else endLeg(); };
  acts.appendChild(nx); nx.focus();
}

function endLeg(){
  var total = run.list.length, pctv = run.correct/total;
  if(!run.practice){
    var prev = state.res[run.leg.id];
    if(!prev || run.correct > prev.correct || (run.correct===prev.correct && run.xp>prev.xp)){
      state.res[run.leg.id] = { correct:run.correct, total:total, xp:run.xp, missed:run.missed };
      save();
    }
  }
  var msg = pctv>=0.9 ? 'Чисто пролетела.' : pctv>=0.7 ? 'Хороший заход, пара тем ещё шатается.' : pctv>=0.5 ? 'Половину знаешь. Перечитай разделы из подсказок и пересдай.' : 'Рейс пока не взят. Перечитай раздел и попробуй ещё раз, так и задумано.';
  var html = header() + '<div class="card"><span class="mono">'+(run.practice?'Работа над ошибками':'Рейс '+run.leg.num+' · '+run.leg.name)+' завершён</span>'+
   '<h2 style="margin:10px 0 6px;font-size:22px">'+msg+'</h2>'+
   '<div class="legres"><div><span class="mono">Верно</span><div class="big">'+run.correct+'/'+total+'</div></div>'+
   (run.practice?'':'<div><span class="mono">Опыт</span><div class="big">+'+run.xp+'</div></div>')+
   '<div><span class="mono">Оценка</span><div class="big" style="color:var(--gold)">'+'★'.repeat(stars(pctv))+(stars(pctv)===0?'—':'')+'</div></div></div>';
  if(run.missed.length){
    html += '<p style="color:var(--muted);margin:0 0 6px">Сложные места:</p><div class="topics">'+
      run.missed.map(function(i){ return '<span class="chip">'+esc(run.leg.qs[i].ref)+'</span>'; }).filter(function(v,i,a){return a.indexOf(v)===i;}).join('')+'</div>';
  }
  html += '<div class="actions">';
  if(run.missed.length) html += '<button class="btn" id="fix">Отработать ошибки</button>';
  html += '<button class="btn'+(run.missed.length?' ghost':'')+'" id="map">К карте рейсов</button>';
  if(!run.practice) html += '<button class="btn ghost" id="again">Пересдать рейс</button>';
  html += '</div>' + (run.practice?'':shareBlock()) + '</div>';
  app.innerHTML = html; toTop();
  if(!run.practice) wireShare();
  var lg = run.leg, missed = run.missed.slice();
  document.getElementById('map').onclick = screenMap;
  var f = document.getElementById('fix'); if(f) f.onclick = function(){ startLeg(lg.id, missed); };
  var a = document.getElementById('again'); if(a) a.onclick = function(){ startLeg(lg.id, false); };
}

function screenFinal(){
  var t = totals(), pct = Math.round(t.c/t.t*100);
  var passed = pct >= 80;
  var rank = pct>=95 ? 'Командир SDR' : pct>=80 ? 'Первый офицер' : pct>=60 ? 'Курсант' : 'Стажёр';
  var verdict = passed ? 'Допуск получен. Покажи талон Насте и переходи к совместной работе: поиск компаний и ЛПР.' : 'Допуска пока нет: нужно 80% и больше. Перечитай разделы из списка ниже и пересдай слабые рейсы.';
  var topics = {};
  LEGS.forEach(function(l){ var r = state.res[l.id]; if(r) r.missed.forEach(function(i){ var k = l.qs[i].ref; topics[k] = (topics[k]||0)+1; }); });
  var topicHtml = Object.keys(topics).sort(function(a,b){return topics[b]-topics[a];}).map(function(k){ return '<span class="chip">'+esc(k)+(topics[k]>1?' ×'+topics[k]:'')+'</span>'; }).join('');
  var today = new Date(); var ds = today.getDate()+'.'+('0'+(today.getMonth()+1)).slice(-2)+'.'+today.getFullYear();
  var legLines = LEGS.map(function(l){ var r=state.res[l.id]; return '<div><span class="mono">'+l.name+'</span><span class="v">'+r.correct+'/'+r.total+'</span></div>'; }).join('');
  app.innerHTML = header() +
   '<div class="ticket"><div class="main"><span class="mono">Посадочный талон · HotelCompas SDR</span>'+
   '<h2>'+esc(state.name||'Без имени')+' · '+rank+'</h2><p style="margin:0;color:var(--muted)">'+verdict+'</p>'+
   '<div class="kv">'+legLines+'</div>'+
   (topicHtml?'<p class="mono" style="margin:20px 0 0">Перечитать</p><div class="topics">'+topicHtml+'</div>':'<p class="mono pass" style="margin-top:20px">Ошибок по темам нет</p>')+
   '</div><div class="stub"><span class="mono">Результат</span><div class="big '+(passed?'pass':'fail')+'">'+pct+'%</div>'+
   '<span class="mono">'+t.c+' из '+t.t+' верно</span><span class="mono">Опыт: '+totalXp()+' XP</span><span class="mono">'+ds+'</span></div></div>'+
   '<div class="actions"><button class="btn ghost" id="map">К карте рейсов</button></div>'+shareBlock();
  document.getElementById('map').onclick = screenMap; wireShare(); toTop();
}

function screenResults(){
  app.innerHTML = header()+'<h2 style="font-size:22px;margin-bottom:12px">Результаты команды</h2><div id="rlist" class="sent">Загружаю…</div><div class="actions"><button class="btn ghost" id="back">Назад</button></div>';
  document.getElementById('back').onclick = screenStart;
  getDocs(collection(fdb,'quizResults')).then(function(snap){
    var docs = snap.docs.map(function(d){ return { id:d.id, d:d.data() }; });
    var box = document.getElementById('rlist');
    if(!docs.length){ box.textContent = 'Пока никто не прошёл тест.'; return; }
    docs.sort(function(a,b){ return String(b.d.updatedAt).localeCompare(String(a.d.updatedAt)); });
    return Promise.resolve({}).then(function(ps){
      box.className=''; box.innerHTML='';
      docs.forEach(function(x){
        var d = x.d, who = (d.name || d.email || 'Без имени') + (d.email && d.name ? ' · '+d.email : '');
        var det = document.createElement('details'); det.className='rrow';
        var sm = document.createElement('summary');
        var a = document.createElement('span'); a.textContent = who + (d.complete?'':' (не закончил)');
        var b = document.createElement('span'); b.className='mono'; b.textContent = d.pct+'% · '+d.correct+'/'+d.total+' · '+new Date(d.updatedAt).toLocaleDateString('ru-RU');
        sm.appendChild(a); sm.appendChild(b); det.appendChild(sm);
        Object.keys(d.legs||{}).forEach(function(k){
          var l = d.legs[k], p = document.createElement('p'); p.style.margin='10px 0 0'; p.textContent = l.name+': '+l.correct+'/'+l.total; det.appendChild(p);
          if(l.missed && l.missed.length){ var ul = document.createElement('ul'); l.missed.forEach(function(q){ var li=document.createElement('li'); li.textContent=q; ul.appendChild(li); }); det.appendChild(ul); }
        });
        box.appendChild(det);
      });
    });
  }).catch(function(){ document.getElementById('rlist').textContent = 'Не удалось загрузить результаты.'; });
}

function screenGate(kind){
  var msg = kind==='login' ? 'Сначала войди в планер HotelCompas: тест использует тот же вход. После входа вернись на эту страницу.' :
            kind==='verify' ? 'Подтверди почту по письму из планера и обнови страницу.' :
            kind==='content' ? 'Не удалось загрузить вопросы. Обнови страницу. Если не помогло, напиши Насте: возможно, у твоего адреса нет доступа к тесту.' :
            'Этот адрес не допущен к тесту. Войди в планер под рабочей почтой.';
  app.innerHTML = '<div class="hero"><span class="mono">HotelCompas · допуск SDR</span><h1>Нужен вход</h1><p>'+msg+'</p></div>'+
    '<div class="actions"><a class="btn" href="index.html" style="text-decoration:none;display:inline-block">Открыть планер</a></div>';
}
/* Вопросы читаются из Firestore (privateContent/quizContent) только после входа */
var quizSource = 'Firebase';
async function loadQuizContent(){
  try{
    var sn = await getDoc(doc(fdb,'privateContent','quizContent'));
    if(sn.exists() && sn.data().legs){
      var arr = JSON.parse(sn.data().legs);
      if(Array.isArray(arr) && arr.length && arr.every(function(l){ return l && Array.isArray(l.qs); })){
        arr.forEach(function(l,i){ l.num = i+1; });
        LEGS = arr;
      }
    }
  }catch(e){ console.error('quiz content', e); }
}
onAuthStateChanged(auth, function(u){
  if(!u){ remote.status='none'; screenGate('login'); return; }
  if(!u.emailVerified){ remote.status='none'; screenGate('verify'); return; }
  if(!allowedUser(u)){ remote.status='none'; screenGate('denied'); return; }
  remote.id = u.uid; remote.email = u.email; remote.status = 'ready';
  remote.owner = u.email.toLowerCase() === NASTYA_EMAIL;
  if(!state.name && u.displayName) state.name = u.displayName;
  loadQuizContent().then(function(){ if(LEGS.length) screenStart(); else screenGate('content'); });
});
